name: Docker Image Push
on: push
jobs:
  linuxbuild:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v6
    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4
    - name: Build and push Linux Docker image
      uses: docker/build-push-action@v7.2.0
      with:
        context: .
        file: Dockerfile.linux
        platforms: linux/amd64,linux/arm64
        push: true
        tags: ${{ secrets.DOCKER_USERNAME }}/dvop400final:linux-latest
  windowsbuild:
    runs-on: windows-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v6
    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
    - name: Build and Push Image
      shell: powershell
      run: |
        # Build the container tagged with the repository name
        docker build -t ${{ secrets.DOCKER_USERNAME }}/dvop400final:windows-latest -f Dockerfile.windows .
        
        # Push the image to Docker Hub
        docker push ${{ secrets.DOCKER_USERNAME }}/dvop400final:windows-latest
    - name: Install Docker Buildx on Windows Runner
      shell: powershell
      run: |
        # 1. Create the official Docker CLI plugins directory
        $pluginDir = "$env:ProgramFiles\Docker\cli-plugins"
        if (!(Test-Path $pluginDir)) { 
            New-Item -ItemType Directory -Force -Path $pluginDir 
        }
        
        # 2. Download the latest stable Buildx binary for Windows
        Invoke-WebRequest -Uri "https://github.com" -OutFile "$pluginDir\docker-buildx.exe"
        
        # 3. Verify that Docker now recognizes the buildx command
        docker buildx version
    - name: Merge Manifests
      run: |
        docker buildx imagetools create ${{ secrets.DOCKER_USERNAME }}/dvop400final:latest ${{ secrets.DOCKER_USERNAME }}/dvop400final:linux-latest ${{ secrets.DOCKER_USERNAME }}/dvop400final:windows-latest
